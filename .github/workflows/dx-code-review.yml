# DX Code Review Bot
#
# Posts a structured DevriX review plus a Conversation comment. Uses
# pull_request_target so the workflow from the base branch runs (trusted)
# and can write the review. The action reads the PR diff via the GitHub API
# and does not check out or execute untrusted fork code.
# On Request changes the PR is converted to draft and the check fails.
name: DX Code Review Bot

on:
  push:
    branches-ignore:
      - master
      - main
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  issue_comment:
    types:
      - created
  workflow_call:
    secrets:
      DEEPSEEK_API_PR_REVIEW:
        required: true
      DX_REVIEW_GITHUB_TOKEN:
        required: false

concurrency:
  group: dx-code-review-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

jobs:
  cancel-on-draft:
    name: Cancel review on draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request_target' && github.event.action == 'converted_to_draft'
    steps:
      - name: Cancel in-progress DX Code Review runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for status in in_progress queued pending; do
            mapfile -t ids < <(
              gh run list --repo "$REPO" --branch "$BRANCH" --status "$status" --limit 50 \
                --json databaseId,workflowName \
                --jq '.[] | select(.workflowName == "DX Code Review Bot" or .workflowName == "DeepSeek Code Review") | .databaseId' \
                || true
            )
            for id in "${ids[@]}"; do
              [ -z "$id" ] && continue
              [ "$id" = "$CURRENT_RUN" ] && continue
              gh run cancel "$id" --repo "$REPO" || true
              echo "Cancelled run $id"
            done
          done

  dx-branch-review:
    name: DX Code Review Bot (branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/') &&
      github.ref_name != github.event.repository.default_branch &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DX review scripts
        uses: actions/checkout@v4
        with:
          repository: DevriX/automatic-pr-check
          ref: ${{ github.repository == 'DevriX/automatic-pr-check' && github.sha || 'master' }}
          path: .dx-bot
          persist-credentials: false

      - name: Review branch before PR
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_PR_REVIEW }}
          GH_TOKEN: ${{ secrets.DX_REVIEW_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROMPT_FILE: ${{ github.workspace }}/.dx-bot/.github/dx-code-review/sys-prompt.md
          MAX_LENGTH: 100000
        run: bash "${{ github.workspace }}/.dx-bot/.github/dx-code-review/review-branch.sh"

  dx-code-review:
    name: DX Code Review Bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'converted_to_draft' &&
        github.event.pull_request.draft == false &&
        github.actor != 'dependabot[bot]' &&
        github.actor != 'renovate[bot]'
      )

    steps:
      - name: Run DX Code Review Bot
        uses: hustcer/deepseek-review@eccde2e9781008d795e366b951e313e37af88dd5 # v1.21
        with:
          chat-token: ${{ secrets.DEEPSEEK_API_PR_REVIEW }}
          github-token: ${{ secrets.DX_REVIEW_GITHUB_TOKEN || github.token }}
          model: deepseek-flash
          temperature: "0.2"
          max-length: 100000
          watch-mention: "@dx-review"
          allowed-associations: OWNER,MEMBER,COLLABORATOR
          exclude-patterns: >
            node_modules/**,
            vendor/**,
            build/**,
            dist/**,
            coverage/**,
            *.min.js,
            *.min.css,
            package-lock.json,
            pnpm-lock.yaml,
            yarn.lock,
            composer.lock,
            *.map,
            *.svg,
            *.woff,
            *.woff2,
            *.ttf,
            *.eot,
            *.png,
            *.jpg,
            *.jpeg,
            *.gif,
            *.webp,
            *.ico,
            *.pdf,
            *.zip,
            *.mo,
            *.pot
          user-prompt: >
            Review this GitHub Pull Request diff as DX Code Review Bot.
            Follow the required output format exactly. Comment only on issues you can
            justify from the changed lines. If there are no justified findings, use a
            Looks good verdict and say so plainly. End with the DX_VERDICT line.
          sys-prompt: |
            You are DX Code Review Bot, the automated code reviewer for DevriX.

            You review WordPress plugins and themes destined for WordPress.com VIP, WordPress.org, and production client sites. You are a Senior WordPress Architect, React/Gutenberg specialist, and security auditor. A human reviewer still owns the merge decision. You reduce their load by catching real defects, not by restating the diff.

            LANGUAGE
            - Write the entire review in English.

            SCOPE
            - Review only the provided git diff. If you cannot point to a changed line, do not report the issue.
            - Do not invent WordPress APIs, VIP helpers, or files that are not in the diff.
            - Do not demand a full-file rewrite. Give the smallest correct fix.
            - Do not report formatting, tabs vs spaces, Yoda conditions, or other PHPCS/WPCS nits unless they hide a real bug.
            - Do not congratulate at length. One short "what looks solid" section is enough, and only if it is true.
            - Ignore generated lockfiles, minified assets, maps, and vendor directories if they appear.

            PRIORITY ORDER
            1. Security: XSS, SQL injection, CSRF/nonce, capability/auth checks, open redirects, unsafe unserialize/eval, secrets, path traversal, missing is_admin / current_user_can on privileged work.
            2. WordPress.com VIP / production safety: raw SQL when a core API exists, uncached or unbounded queries, direct filesystem writes, unsafe HTTP requests, hooks that run too early or on every request, deprecated APIs.
            3. Gutenberg / React / REST: unsanitized attributes, dangerouslySetInnerHTML, REST permission_callback of __return_true on writes, missing save/render escaping, leaking subscriptions.
            4. Correctness: broken logic, race conditions, wrong data types, missing unslash/sanitize before persist, i18n escaping mistakes that become XSS (echo __() without esc_*).
            5. Performance: N+1 queries, SELECT *, missing LIMIT, missing cache, autoloaded options written in a hot hook, shortcodes that read superglobals and break page cache.

            REQUIRED OUTPUT FORMAT
            Start with exactly:

            # DX Code Review Bot
            > Automated review by DevriX. A human still owns the merge decision.

            Then:

            ## Verdict
            One of: **Request changes** | **Comment** | **Looks good**
            - Request changes: any Blocker or High finding.
            - Comment: Medium findings only.
            - Looks good: no findings, or only Nits.

            ## Findings
            Group by severity in this order: Blocker, High, Medium, Nit.
            Omit empty severity groups.
            Maximum 12 findings total. Merge duplicates. Highest severity first.
            Include Nits only when there are fewer than 3 Blocker/High/Medium items, and at most 3 Nits.

            For each finding use:

            ### [SEVERITY] Short title
            - **Where:** `path/to/file.php` around the changed line
            - **Risk:** one or two sentences, concrete (who can exploit it, what breaks in production)
            - **Fix:** a minimal snippet or exact function to use (`esc_html()`, `absint()`, `$wpdb->prepare()`, `check_ajax_referer()`, `current_user_can()`, `wp_kses_post()`, `vip_safe_wp_remote_get()`, etc.)

            ## Residual risk
            What you could not verify from the diff (e.g. a callee in another file). If nothing, write "None from this diff."

            End the review with exactly one of these lines, with no extra text after it:
            DX_VERDICT: REQUEST_CHANGES
            DX_VERDICT: COMMENT
            DX_VERDICT: LOOKS_GOOD

            VERDICT DISCIPLINE
            - If the diff is clean, say so. Do not manufacture issues to look thorough.
            - If the author labeled the change as an intentional insecure fixture, still report the issues; note that it appears intentional, and keep the verdict Request changes.
            - Prefer core WordPress APIs over custom SQL or filesystem access.
            - Prefer `$_GET` / `$_POST` over `$_REQUEST`. Always `wp_unslash()` then sanitize.
            - Escape at output; sanitize at input. Name the exact helper.
            - AJAX/REST/form handlers need both a nonce (or equivalent auth) and a capability check. `wp_ajax_nopriv_` on a write endpoint is usually a Blocker.
            - Direct writes under `ABSPATH` or `WP_CONTENT_DIR` are Blocker on VIP.
            - `admin_init` must not echo HTML; notices belong on `admin_notices`.

      - name: Post conversation comment and convert to draft if needed
        env:
          GH_TOKEN: ${{ secrets.DX_REVIEW_GITHUB_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail

          reviews_json="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews")"
          review_count="$(printf '%s' "$reviews_json" | jq 'length')"
          marker='<!-- dx-code-review-bot -->'

          post_or_update_comment() {
            local body="$1"
            local comment_id
            comment_id="$(
              gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
                --jq ".[] | select(.body | contains(\"${marker}\")) | .id" \
                | tail -n1 || true
            )"
            if [ -n "$comment_id" ]; then
              gh api -X PATCH "repos/${REPO}/issues/comments/${comment_id}" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            fi
          }

          if [ "$review_count" = "0" ]; then
            post_or_update_comment "${marker}
## DX Code Review Bot

No review was posted. Common causes:

- The PR title or description contains \`skip cr\` or the skip-review keyword
- The diff was empty after ignoring generated files

Remove those keywords from the title/description and push a commit, or comment \`@dx-review\`.
"
            echo "No review payload to enforce."
            exit 0
          fi

          body="$(printf '%s' "$reviews_json" | jq -r '.[-1].body // ""')"
          review_url="$(printf '%s' "$reviews_json" | jq -r '.[-1].html_url // ""')"
          verdict="COMMENT"

          if printf '%s' "$body" | grep -qiE 'DX_VERDICT:[[:space:]]*REQUEST_CHANGES'; then
            verdict="REQUEST_CHANGES"
          elif printf '%s' "$body" | grep -qiE 'DX_VERDICT:[[:space:]]*LOOKS_GOOD'; then
            verdict="LOOKS_GOOD"
          elif printf '%s' "$body" | grep -qiE 'DX_VERDICT:[[:space:]]*COMMENT'; then
            verdict="COMMENT"
          elif printf '%s' "$body" | grep -qiE 'Request changes|Do not merge|🔴 CRITICAL|### \[BLOCKER\]'; then
            verdict="REQUEST_CHANGES"
          elif printf '%s' "$body" | grep -qiE 'Looks good'; then
            verdict="LOOKS_GOOD"
          fi

          comment="${marker}
## DX Code Review Bot

**Verdict:** \`${verdict}\`
"

          if [ -n "$review_url" ]; then
            comment="${comment}
Full findings: ${review_url}
"
          fi

          if [ "$verdict" = "REQUEST_CHANGES" ]; then
            is_draft="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.draft')"
            if [ "$is_draft" != "true" ]; then
              node_id="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.node_id')"
              gh api graphql -f query='mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { isDraft } } }' -f id="$node_id" >/dev/null
              echo "Converted PR #${PR_NUMBER} to draft."
            fi
            comment="${comment}
This pull request was moved back to **draft** because the review found Blocker/High issues. The check is red until those are fixed.

Mark it **Ready for review** after addressing the findings.
"
            post_or_update_comment "$comment"
            echo "Negative verdict: failing the job so the PR check is red."
            exit 1
          fi

          if [ "$verdict" = "LOOKS_GOOD" ]; then
            comment="${comment}
No Blocker/High issues from this diff.
"
          else
            comment="${comment}
Medium findings only. A human reviewer should still confirm before merge.
"
          fi

          post_or_update_comment "$comment"
          echo "Verdict ${verdict}: leaving the PR open."
